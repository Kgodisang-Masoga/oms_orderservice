server:
  port: 8082

spring:
  application:
    name: orderservice
  datasource:
    url: jdbc:mysql://localhost:3306/order_db
    username: root
    password: 12345
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
      open-in-view: false

jwt:
  secret: "fnb-b4-bootcamp-shared-jwt-signing-secret-change-me-32bytes-min"
  expiration-ms: 3600000 #an hour